<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>网络测绘系统</title>
    <link rel="stylesheet" href="home.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
    <header class="navbar">
        <div class="logo">网络测绘系统</div>
        <nav class="nav-links" role="navigation" aria-label="主导航">
            <button class="nav-item active" data-page="dashboard" aria-current="page">仪表盘</button>
            <button class="nav-item" data-page="scan">扫描任务</button>
            <button class="nav-item" data-page="database">数据库管理</button>
            <button class="nav-item" data-page="settings">系统设置</button>
            <div class="nav-slider"></div> <!-- 滑动条 -->
        </nav>
    </header>

    <main class="content" role="main">
        <section class="page active" id="dashboard" tabindex="0">
            <h2>仪表盘</h2>
            <div class="cards">
                <div class="card">
                    <h3>系统状态</h3>
                    <ul class="status-list">
                        <li>扫描器运行状态：<span class="status running">运行中</span></li>
                        <li>PostgreSQL 状态：<span class="status ok">已连接</span></li>
                        <li>当前扫描 IP 总数：<span id="ip-count" class="count">0</span></li>
                    </ul>
                </div>
                <div class="card">
                    <h3>资源使用情况</h3>
                    <div class="progress-group">
                        <label>CPU 使用率</label>
                        <div class="progress-bar">
                            <div id="cpu-usage" class="progress-fill" style="width: 25%;"></div>
                        </div>
                        <span id="cpu-percent">25%</span>
                    </div>
                    <div class="progress-group">
                        <label>内存使用率</label>
                        <div class="progress-bar">
                            <div id="memory-usage" class="progress-fill" style="width: 40%;"></div>
                        </div>
                        <span id="memory-percent">40%</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="page" id="scan" tabindex="0">
            <h2>扫描任务</h2>

            <form id="task-form" class="task-form">
                <div class="form-group">
                    <label for="target">扫描目标（单IP或CIDR）</label>
                    <input type="text" id="target" name="target" placeholder="例如：192.168.1.1 或 192.168.0.0/24" required />
                </div>

                <div class="form-group">
                    <label for="priority">任务优先级</label>
                    <select id="priority" name="priority" required>
                        <option value="">请选择优先级</option>
                        <option value="low">低</option>
                        <option value="medium">中</option>
                        <option value="high">高</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ports">目标端口（多个端口用逗号分隔）</label>
                    <input type="text" id="ports" name="ports" placeholder="例如：80,443,8080" required />
                </div>

                <button type="submit" class="btn-submit">添加任务</button>
            </form>

            <div id="task-list" class="task-list">
                <!-- 这里显示添加的任务 -->
            </div>
        </section>

        <section class="page" id="database" tabindex="0">
            <h2>数据库管理</h2>
            <p>这里可以查看数据库状态、表结构等...</p>
        </section>

        <section class="page" id="settings" tabindex="0">
            <h2>系统设置</h2>
            <p>这里是系统配置页面...</p>
        </section>
    </main>

    <script src="home.js"></script>
</body>
</html>
