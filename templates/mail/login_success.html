<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; padding: 24px; background: #f3f4f6; color: #1f2937; font-family: Arial, sans-serif; }
    .card { max-width: 600px; margin: 0 auto; padding: 32px; background: #ffffff; border-radius: 12px; }
    .title { margin: 0 0 16px; color: #111827; font-size: 24px; }
    .detail { margin: 8px 0; color: #4b5563; }
    .footer { margin-top: 24px; color: #9ca3af; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="title">登录成功</h1>
    <p>用户 <strong>{{ username }}</strong> 已成功登录 {{ system_name }}。</p>
    <p class="detail">登录时间：{{ login_time }}</p>
    <p class="detail">来源地址：{{ source_ip }}</p>
    <p class="footer">如果这不是您预期的操作，请立即检查账号安全设置。</p>
  </div>
</body>
</html>
