     <!-- 加载部分js资源 -->
     <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
     <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
     <script src="common.js"></script>
     <script src="dashboard.js"></script>

     <script>

        
        var options = {
          series: [{
          name: 'series1',
          data: ["31", 40, 28, 51, 42, 109, 100, null]
        }, {
          name: 'series2',
          data: [11, 32, 45, 32, 34, 52, 41, null]
        }, {
            name: 'series3',
            data: [22, 28, 66, 16, 78, 11, 40, 99]
        }],
          chart: {
          height: "100%",
          width: "100%",
          type: 'area',
          toolbar: {
            show: true,
            tools: {
                customIcons: [
                    {
                    icon: eyeIcon, // 你可以用 HTML/SVG
                    index: -2,   // 按钮插入的位置，-1 表示最后
                    title: '显示标签',
                    class: 'chart-show-label',
                    click: showlabel
                    }
                ]
            }
          }
        },
        dataLabels: {
          enabled: false
        },
        stroke: {
          curve: 'smooth'
        },
        xaxis: {
          type: 'datetime',
          categories: ["2018-09-19 00:00:00", "2018-09-19 01:30:00", "2018-09-19 02:30:00", "2018-09-19 03:30:00", "2018-09-19 04:30:00", "2018-09-19 05:30:00", "2018-09-19 06:30:00", "2018-09-19 07:30:00" ]
        //   categories: ["2018-09-19T00:00:00.000Z", "2018-09-19T01:30:00.000Z", "2018-09-19T02:30:00.000Z", "2018-09-19T03:30:00.000Z", "2018-09-19T04:30:00.000Z", "2018-09-19T05:30:00.000Z", "2018-09-19T06:30:00.000Z", "2018-09-19T07:30:00.000Z" ]
        },
        title: {
            text: '扫描数据图'
        },
        tooltip: {
            shared: true,
            intersect: false,
            x: {
                format: 'yyyy/MM/dd HH:mm'
            },
        },
        };

        var chart = new ApexCharts(document.querySelector("#chart"), options);
        chart.render();

        
        // document.getElementById("toggle-charts").addEventListener( "click", );
        function showlabel() {
            labelEnables = !labelEnables;
            chart.updateOptions({
                dataLabels: {
                    enabled: labelEnables
                }
            });
        }


        var multiple_options = {
          series: [44, 55, 67, 83, 11],  //百分比
          chart: {
          height: "100%",
          width: "100%",
          type: 'radialBar',
        },
        title: {
            text: '已扫描IP'
        },
        plotOptions: {
          radialBar: {
            dataLabels: {
                show: true,
              name: {
                show: true,
                fontSize: '22px',
              },
              value: {
                fontSize: '16px',
              },
              barLabels: {
                enabled: true,
                fontSize: '16px'
              },
              total: {
                show: true,
                label: 'Total',
                formatter: function (w) {
                  // By default this function returns the average of all series. The below is just an example to show the use of custom formatter function
                  return "约37亿"
                }
              }
            }
          }
        },
        labels: ['Apples', 'Oranges', 'Bananas', 'Berries', 'China'],
        };

        var multiple_chart = new ApexCharts(document.querySelector("#multiple_chart"), multiple_options);
        multiple_chart.render();



        // 资源图
        var resource_options = {
          series: [{
          name: '使用',
          data: [44, 55, 41]
        }, {
          name: '空闲',
          data: [11, 17, 15]
        }],
          chart: {
          type: 'bar',
          height: '100%',
          width: '100%',
          stacked: true,
          stackType: '100%'
        },
        title: {
            text: '系统资源使用状况'
        },
        responsive: [{
          breakpoint: 480,
          options: {
            legend: {
              position: 'bottom',
              offsetX: -10,
              offsetY: 0
            }
          }
        }],
        xaxis: {
          categories: ['CPU', 'RAM', 'DISK'],
        },
        fill: {
          opacity: 1
        },
        legend: {
          position: 'right',
          offsetX: 0,
          offsetY: 50
        },
        };

        var resource_chart = new ApexCharts(document.querySelector("#resource_chart"), resource_options);
        resource_chart.render();


        // 系统在线时间状态
        var system_online_options = {
          series: [
          {
            name: '在线',
            data: [
              {
                x: 'WEB',
                y: [
                  new Date('2025-03-05').getTime(),
                  new Date('2025-07-01').getTime()
                ]
              }
            ]
          },
          {
            name: '离线',
            data: [
                {
                    x: 'WEB',
                    y: [
                        new Date('2025-07-01').getTime(),
                        new Date('2025-07-03').getTime()
                    ],
                    fillColor: '#d54941'
                }
            ],
            fillColor: '#d54941'
          },
          {
            name: '维护',
            data: [
                {
                    x: 'WEB',
                    y: [
                        new Date('2025-07-03').getTime(),
                        new Date('2025-07-04').getTime()
                    ]
                }
            ]
          }
        ],
          chart: {
          height: '100%',
          width: '100%',
          type: 'rangeBar'
        },
        title: {
            text: '系统在线状态'
        },
        // fill: {
        //   type: 'solid'
        // },
        plotOptions: {
          bar: {
            borderRadius: 10,
            horizontal: true,
            rangeBarGroupRows: true
          }
        },
        dataLabels: {
          enabled: true,
          formatter: function(val) {
            var a = moment(val[0])
            var b = moment(val[1])
            var diff = b.diff(a, 'days')
            return diff + (diff > 1 ? ' days' : ' day')
          }
        },
        fill: {
          type: 'gradient',
          gradient: {
            shade: 'light',
            type: 'vertical',
            shadeIntensity: 0.25,
            gradientToColors: undefined,
            inverseColors: true,
            opacityFrom: 1,
            opacityTo: 1,
            stops: [50, 0, 100, 100]
          }
        },
        xaxis: {
          type: 'datetime'
        },
        legend: {
          position: 'top'
        }
        };

        var system_online_chart = new ApexCharts(document.querySelector("#system_online_chart"), system_online_options);
        system_online_chart.render();
     </script>
