[package]
name = "rust_web_test"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-files = "0.6"
actix-session = "0.10"
tera = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
tracing-appender = "0.2"
rand = "0.9"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
deadpool = "0.12"
argon2 = "0.5"
password-hash = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
uuid = { version = "1.18", features = ["v4"]}
sysinfo = "0.36"
chrono = "0.4"
postgres-types = { version = "0.2", features = ["derive", "with-serde_json-1"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3